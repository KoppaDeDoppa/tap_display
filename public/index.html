<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brewery Tap Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="venue-name">BODENBAR MADAFAKKA!!</h1>
    <div class="status-indicator" id="connectionStatus">
      <span class="status-dot"></span>
      <span class="status-text">Connecting...</span>
    </div>
  </header>

  <main class="taps-grid" id="tapsGrid">
    <!-- Tap cards will be dynamically generated here -->
  </main>

  <footer class="footer">
    <div class="last-updated" id="lastUpdated">Last updated: --</div>
    <div class="version">Tap Display v0.3.8</div>
  </footer>

  <section id="paymentOverlay" class="payment-overlay" role="status" aria-live="polite" aria-label="Vipps-betaling" hidden>
    <div class="payment-layout">
      <div class="payment-qr-frame"><img id="paymentQr" alt="Skann Vipps QR-koden" width="600" height="600"></div>
      <div class="payment-copy">
        <h2>Betal med Vipps</h2>
        <p id="paymentAmount" class="payment-amount"></p>
        <p>Skriv inn beløpet i Vipps.</p>
        <p class="payment-countdown">Tilbake til tappene om <span id="paymentSeconds">30</span> sekunder</p>
      </div>
    </div>
  </section>
  <script src="payment.js"></script>
  <script src="app.js"></script>
</body>
</html>
